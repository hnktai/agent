# /etc/nginx/sites-available/agent.hnkt.vn
# Nginx Reverse Proxy Configuration for GoClaw on agent.hnkt.vn

# HTTP redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name agent.hnkt.vn;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agent.hnkt.vn;

    # SSL Certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/agent.hnkt.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.hnkt.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Client upload size (allow file & document uploads for agent memory/vault)
    client_max_body_size 500M;

    # Logs
    access_log /var/log/nginx/agent.hnkt.vn.access.log;
    error_log /var/log/nginx/agent.hnkt.vn.error.log;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Upstream GoClaw Backend & Web UI
    # Default port is 18790
    set $goclaw_backend "http://127.0.0.1:18790";

    # WebSocket Proxy for Real-time Streaming & Agent Teams
    location /ws {
        proxy_pass $goclaw_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Keep connection open for streaming LLM responses & heartbeats
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;

        # Disable buffering for low-latency streaming
        proxy_buffering off;
        proxy_cache off;
    }

    # REST API endpoints
    location /v1/ {
        proxy_pass $goclaw_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Health check
    location /health {
        proxy_pass $goclaw_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static Assets & Embedded Web Dashboard
    location / {
        proxy_pass $goclaw_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
